<!DOCTYPE html>
<html lang="en">

<head>
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="left-login">

            <h2>Lumina</h2>

            <h1>Welcome back!</h1>

            <p>Pick up where you left off, and keep things moving.</p>

            <form>

                <input type="email" placeholder="john.doe@gmail.com">

                <input type="password" placeholder="••••••••">

                <div class="options">
                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot password?</a>
                </div>

                <button>Log in →</button>

            </form>

            <div class="or">or</div>

            <button class="google">
              <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
     alt="Google"
     width="20"
     height="10">
                Continue with Google</button>

            <p class="signup">
                Don't have an Account?
                <a href="#">Sign up</a>
            </p>

        </div>


        <div class="right">

            <img class="right-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRqdBca5i8vm7MlLEMo5MyVCtjGP7eThEVfXQgq30eAPw&s=10" alt="Image">
        </div>
            </div>

        </div>

    </div>

</body>

</html>
