<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body class="min-h-screen bg-black flex items-center justify-center overflow-hidden">

    <div
        class="absolute w-[650px] h-[230px] rounded-[50%]
        -right-32 top-24 rotate-[-25deg]
        opacity-80 pointer-events-none
        bg-[repeating-radial-gradient(ellipse_at_center,transparent_0px,transparent_2px,#ff00d4_3px,transparent_4px)]
        shadow-[0_0_30px_#ff00d4,0_0_60px_rgba(255,0,212,0.5)]">
    </div>

    <div
        class="absolute w-[650px] h-[230px] rounded-[50%]
        -left-40 bottom-20 rotate-[20deg]
        opacity-80 pointer-events-none
        bg-[repeating-radial-gradient(ellipse_at_center,transparent_0px,transparent_2px,#ff3b18_3px,transparent_4px)]
        shadow-[0_0_30px_#ff3b18,0_0_60px_rgba(255,60,20,0.5)]">
    </div>


    <div
        class="relative z-10
        w-[520px] h-[520px]
        rounded-full
        flex flex-col justify-center items-center
        p-20

        bg-linear-to-br from-white/20 to-white/5

        border-2 border-white/25

        backdrop-blur-[15px]

        shadow-[inset_0_0_30px_rgba(255,255,255,0.05),0_0_30px_rgba(255,255,255,0.08)]">

        <h1
            class="text-white text-[28px] font-normal
            mb-7 self-start">
            LOGIN
        </h1>


        <form
            id="login"
            class="w-full flex flex-col items-center">


            <!-- ================= USERNAME ================= -->

            <div
                class="relative w-[315px] h-[58px]
                mb-[22px]
                rounded-[15px]

                bg-linear-to-r
                from-white/13
                to-cyan-400/10

                border-2 border-white/25

                shadow-[inset_0_0_15px_rgba(255,255,255,0.05)]">

                <input
                    type="email"
                    id="email"
                    placeholder="sample@example.com"
                    required

                    class="w-full h-full
                    bg-transparent
                    outline-none
                    border-none

                    text-white
                    text-[17px]

                    pl-6 pr-[55px]

                    placeholder:text-white
                    placeholder:opacity-90">

                <i
                    class="fa-solid fa-user
                    absolute right-[18px] top-1/2
                    -translate-y-1/2
                    text-white text-[27px]">
                </i>

            </div>


            <div
                class="relative w-[315px] h-[58px]
                mb-[22px]
                rounded-[15px]

                bg-linear-to-r
                from-white/13
                to-cyan-400/10

                border-2 border-white/25

                shadow-[inset_0_0_15px_rgba(255,255,255,0.05)]">

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required

                    class="w-full h-full
                    bg-transparent
                    outline-none
                    border-none

                    text-white
                    text-[17px]

                    pl-6 pr-[55px]

                    placeholder:text-white
                    placeholder:opacity-90">

                <i
                    class="fa-solid fa-lock
                    absolute right-[18px] top-1/2
                    -translate-y-1/2
                    text-white text-[27px]">
                </i>

            </div>


            <button
                type="submit"

                class="w-[128px] h-12
                mt-2 mb-[30px]

                rounded-[15px]

                border-2 border-white/25

                bg-linear-to-br
                from-white/20
                to-black/80

                text-white text-[18px]

                cursor-pointer

                shadow-[0_5px_15px_rgba(0,0,0,0.4)]

                hover:scale-105
                hover:shadow-[0_0_20px_rgba(255,255,255,0.2)]

                active:scale-95

                transition duration-300">

                LOGIN

            </button>

            <div
                class="w-[315px]
                flex justify-between items-center
                text-white text-[15px]">

                <label
                    class="flex items-center gap-2 cursor-pointer">

                    <input
                        type="checkbox"
                        id="remember"
                        class="cursor-pointer">

                    <span>
                        Remember me
                    </span>

                </label>

                <a
                    href="#"
                    id="forgotPassword"
                    class="text-white no-underline hover:underline">

                    Forgot password?

                </a>

            </div>

        </form>
        <script src="script.js"></script>

    </div>
</body>
</html>
