<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    

    <title>Registration Form</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>


<body class="min-h-screen flex items-center justify-center
             bg-gradient-to-tr from-blue-700 via-sky-500 to-emerald-400">


    <div class="relative bg-white w-[400px] p-8 shadow-2xl">

        


        <h1 class="text-center text-blue-700 text-xl font-semibold mb-8">

            • Registration Form •

        </h1>


        <form id="registerForm">


            <div class="mb-5">

                <label class="text-sm text-gray-600">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"

                    class="w-full border-b-2 border-emerald-400
                           py-2 outline-none
                           focus:border-blue-600">

           
            </div>

            <div class="mb-5">

                <label class="text-sm text-gray-600">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"

                    class="w-full border-b-2 border-emerald-400
                           py-2 outline-none
                           focus:border-blue-600">


            </div>

            <div class="mb-5">

                <label class="text-sm text-gray-600">
                    Course
                </label>

                <select
                    id="country"

                    class="w-full border-b-2 border-emerald-400
                           py-2 outline-none">

                    <option value="">
                        Select Course
                    </option>

                    <option value="Python">
                        Python
                    </option>

                    <option value="Data Analyst">
                        Data Analyst
                    </option>

                    <option value="Full Stack">
                        Full Stack
                    </option>

                    <option value="AI / ML">
                        AI / ML
                    </option>

                    <option value="Data science">
                        Data science
                    </option>

                </select>

            </div>

            <div class="mb-5">

                <label class="text-sm text-gray-600">
                    Phone
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number"

                    class="w-full border-b-2 border-emerald-400
                           py-2 outline-none
                           focus:border-blue-600">

                
            </div>


            <div class="mb-5">

                <label class="text-sm text-gray-600">
                    Password
                </label>

                <div class="relative">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"

                        class="w-full border-b-2 border-emerald-400
                               py-2 pr-10 outline-none
                               focus:border-blue-600">


                    <button
                        type="button"
                        id="showPassword"

                        class="absolute right-0 top-2
                               text-blue-600">

                        

                    </button>

                </div>


                <div class="w-full h-1 bg-gray-200 mt-2">

                    <div
                        id="strengthBar"
                        class="h-1 w-0">
                    </div>

                </div>

            </div>

            <button
                type="submit"

                class="block mx-auto
                       px-10 py-3
                       text-white text-sm
                       bg-gradient-to-r
                       from-blue-600 to-emerald-400
                       shadow-md
                       hover:shadow-lg">

               SUBMIT

            </button><br>

            <button type="button" class="show block mx-auto
                       px-10 py-3
                       text-white text-sm
                       bg-gradient-to-r
                       from-blue-600 to-emerald-400
                       shadow-md
                       hover:shadow-lg">
    View Details
</button>

<div class="show-container"></div>



        </form>

    </div>

    <script src="script.js"></script>

</body>

</html>
