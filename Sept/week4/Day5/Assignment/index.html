<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body class="body" style=" width:full;height:800px; display:flex;  background-image:url('girlimg.png'); background-position:center; background-repeat:no-repeat; background-size:cover">
    

    <div class="container" style="border: px solid black; background-color:rgb(251, 212, 220); padding:20px;  height:600px; width:600px;
     border-radius:20px; justify-content:center; margin:100px; margin:left 100px; box-sizing: border-box; " >
        <div class="logo" style="width:600px; height:100px; margin:left 5px; display:flex; gap:20px">
            <img src="logo.png" alt="logo" style="width:150px; height:100%;">
         <h1 class="heading" style="font-weight: 90px; color:rgb(12, 5, 90); width:100%; top:100px;">Student Registration Page</h1>
        </div><br>

        <hr class="line" style="  border: none;
        border-top: 1px solid rgb(17, 1, 68);
        width: 90%;">

        <form action=""  class="register" style="padding: 32px;">
        <label for="Name">Name :</label>
        <input type="text" name="Full Name" placeholder="Enter Your Name" style="width:full; padding:4px; border-radius:4px; border:2px solid orange;"><br><br>

         <label for="Email :">Email :</label>
        <input type="email" name="email" placeholder="sample@example.com" style="width:full; padding:4px; border-radius:4px; border:2px solid orange;"><br><br>
         
         <label for="Phone">Phone :</label>
        <input type="number" name="Phone" placeholder="xxxxxxxxxx" style="width:full; padding:4px; border-radius:4px; border:2px solid orange;"><br><br>

        <label for="Date of Birth :">Date of Birth :</label>
        <input type="Date of Birth" name="Date of Birth" placeholder="MM/DD/YYYY" style="width:full; padding:4px; border-radius:4px; border:2px solid orange; "><br><br>

        <label>Gender :</label>
        
        <input type="radio" name="gender" value="Male" >
        <label>Male</label>
        
        
        <input type="radio" name="gender" value="Female">
        <label>Female</label> 

        
        <input type="radio" name="gender" value="other">
         <label>other</label> 
        <br><br>

        <label for="dob">Address :</label><br>
        <textarea name="" id="address" cols="50" style="width:full; padding:4px; border-radius:4px; border:2px solid orange;"></textarea><br><br>

        <input type="submit" value="Submit" style="width:full; padding:4px; border-radius:4px; border:2px solid orange; " onmouseover="this.style.backgroundColor='orange'" onmouseout="this.style.backgroundColor='white'"><br><br>

        <button class="show" style="width:full; padding:4px; border-radius:4px; border:2px solid orange; " onmouseover="this.style.backgroundColor='orange'" onmouseout="this.style.backgroundColor='white'">View Detail</button>


        <div class="show-container" style="border: px solid red; padding: 10px;"></div>
        </div>




    <script src="script.js"></script>
</body>

</html>
