<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="heading">Registration Form</h1><br>
    <form action="">
        <label for="Name">Name :</label>
        <input type="text" name="Full Name" placeholder="Enter Your Name"><br><br>
        
        <label for="email">email :</label>
        <input type="email" name="email" placeholder="sample@example.com"><br><br>
         
         <label for="Phone :">Phone</label>
        <input type="number" name="Phone" placeholder="xxxxxxxxxx"><br><br>

        <label>Gender :</label>
        <label for="Male">Male</label>
        <input type="radio" name="Gender" value="Male">
        
        <label for="Female">Female</label> 
        <input type="radio" name="Gender" value="Female">

        <label for="other">other</label> 
        <input type="radio" name="Gender" value="other">
        <br><br>

        <label for="Course">Course :</label>

         <label for="c">C</label>
        <input type="checkbox" id="c" name="course" value="C">
        
        <label for="python">Python</label>
        <input type="checkbox" id="cpp" name="course" value="C++">
        
        <label for="java">Java</label>
        <input type="checkbox" id="java" name="course" value="Java">
        
        <label for="ai">AI</label>
        <input type="checkbox" id="ai" name="course" value="AI">
       
        <label for="ml">ML</label>
        <input type="checkbox" id="ml" name="course" value="ML">
         <br><br>

        <label for="Password">Password :</label>
        <input type="Password" name="Password" placeholder="Enter Your Password"><br><br>

        <label for="Confirm Password">Confirm Password :</label>
        <input type="Confirm Password" name="Confirm Password" placeholder="Confirm Password"><br><br>

        <button>Submit</button>


    </form>
    <script src="script.js"></script>
</body>
</html>
