<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
</head>

<body style="background-color: white;">

    <!-- Login Form -->
    <div style="width: 600px; margin: 100px auto;">

        <!-- Heading -->
        <h1>Login form using HTML and CSS</h1>

        <!-- Sign In -->
        <h2>Sign in</h2>

        <p>Sign in with your username and password</p>

        <!-- Username -->
        <label for="username">Your username :</label>
        <input type="text" id="username" name="username"
               placeholder="Enter Username" required>
        <br><br>

        <!-- Password -->
        <label for="password">Your password :</label>
        <input type="password" id="password" name="password"
               placeholder="Enter Password" required>
        <br><br>

        <!-- Login Button -->
        <button type="submit">Login</button>

        <br><br>

        <!-- Register -->
        <p>
            Not a member?
            <a href="#">Register here!</a>
        </p>

    </div>

</body>



<body style="background-color: white;">
    <div style="background-color: aqua;border:3px solid #008b8b; padding:25px; width:700px; margin:30px auto;"

    <!-- Student Registration Form -->
    <h2 style="text-align: center;border:3px double #006666;padding:15px">Student Registration Form</h2>

    <form>

        <!-- Name -->
        <label for="name">Name :</label>
        <input type="text" id="name" name="name"
               placeholder="Enter full name" required>
        <br><br>

        <!-- Father's Name -->
        <label for="fathername">Father's Name :</label>
        <input type="text" id="fathername" name="fathername">
        <br><br>

        <!-- Mother's Name -->
        <label for="mothername">Mother's Name :</label>
        <input type="text" id="mothername" name="mothername">
        <br><br>

        <!-- Phone Number -->
        <label for="phone">Phone Number :</label>
        <input type="tel" id="phone" name="phone"
               placeholder="017xxxxxxxx">
        <br><br>

        <!-- Email -->
        <label for="email">Email :</label>
        <input type="email" id="email" name="email"
               placeholder="sample@example.com">
        <br><br>

        <!-- Gender -->
        <label>Gender :</label>

        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>

        <br><br>

        <!-- Date Of Birth -->
        <label for="dob">Date Of Birth :</label>
        <input type="date" id="dob" name="dob">
        <br><br>

        <!-- Address -->
        <label for="address">Address :</label>
        <textarea id="address" name="address"
                  placeholder="Street - House - Road"></textarea>
        <br><br>

        <!-- Blood Group -->
        <label for="blood">Blood Group :</label>

        <select id="blood" name="blood">
            <option value="">Select</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select>

        <br><br>

        <!-- Department -->
        <label>Department :</label>

        <input type="radio" id="cse" name="department" value="CSE">
        <label for="cse">CSE</label>

        <input type="radio" id="eee" name="department" value="EEE">
        <label for="eee">EEE</label>

        <input type="radio" id="bba" name="department" value="BBA">
        <label for="bba">BBA</label>

        <br><br>

        <!-- Course -->
        <label>Course :</label>

        <input type="checkbox" id="c" name="course" value="C">
        <label for="c">C</label>

        <input type="checkbox" id="cpp" name="course" value="C++">
        <label for="cpp">C++</label>

        <input type="checkbox" id="java" name="course" value="Java">
        <label for="java">Java</label>

        <input type="checkbox" id="ai" name="course" value="AI">
        <label for="ai">AI</label>

        <input type="checkbox" id="ml" name="course" value="Machine Learning">
        <label for="ml">Machine Learning</label>

        <input type="checkbox" id="robotics" name="course" value="Robotics">
        <label for="robotics">Robotics</label>

        <br><br>

        <!-- Photo -->
        <label for="photo">Photo :</label>
        <input type="file" id="photo" name="photo"
               accept="image/*">

        <br><br>

        <!-- Submit and Reset -->
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
