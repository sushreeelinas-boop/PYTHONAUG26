<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <select name="" id="">
        <option value="India">India</option>
        <option value="Chain">Chain</option>
        <option value="US">US</option>
        <option value="Pakistan">Pakistan</option>
    </select>
    
<input type="text" placeholder="search" list="data-list">

<datalist id="data-list">
    <option value="Sonali"></option>
    <option value="Elina"></option>
    <option value="Pratik"></option>
    <option value="Sangram"></option>
    <option value="Anu"></option>
</datalist>
<fieldset>
    <legend>Personal Information</legend>
<input type="text" placeholder="Enter your name" /><br>
<input type="text" placeholder="Enter your age" /><br>
<input type="text" placeholder="Enter your email" /><br>
<input type="text" placeholder="Enter your password" /><br>
<input type="text" placeholder="Enter your Address" /><br>
<textarea name="" id="" cols="50"></textarea><br>

<iframe src="https://qlith.com/" frameborder="0">


</iframe>
</fieldset>
<form>

        <!-- Name -->
        <label for="Full Name"> Full Name :</label>
        <input type="text" id="name" name="Full Name"
               placeholder=" full Name" required>
        <br><br>
        <label for="password">Password</label>
         <input type="password" id="number" name="password" placeholder="Password">
         <br>
          <!-- Gender -->
        <label>Gender :</label>

        <input type="radio" id="male"value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female"value="Female">
        <label for="female">Female</label>
        <br><br>

         <!-- Email -->
        <label for="email">Email :</label>
        <input type="email" placeholder="sample@example.com">
        <br><br>
        <!-- Phone Number -->
        <label for="phone">Phone Number :</label>
        <select  name="" id="">
        <option value="+91">+91</option>
        </select>
        <input type="tel" id="phone" name="phone"
               placeholder="9852xxxxxxxx">

        <br><br>
        <button>Submit</button>
        <br><br>
        <h5><span style="color: burlywood;">HTML Form</span></h5>
        

</body>
</html>
