<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>
        <div class="forms-container">

            <div class="form-section">
                <h3>DO:</h3>

                <div class="form-box">

                    <label for="do-name">Name</label>
                    <input type="text"
                           id="do-name"
                           placeholder="Name">

                    <label for="do-email">Email</label>
                    <input type="email"
                           id="do-email"
                           placeholder="Email">

                    <label for="do-company">Company</label>
                    <input type="text"
                           id="do-company"
                           placeholder="Company">

                </div>
            </div>

            <div class="form-section">
                <h3>DON'T:</h3>

                <div class="form-box">

                    <label for="dont-name">Name</label>
                    <input type="text"
                           id="dont-name"
                           placeholder="Name">

                    <label for="dont-email">Email</label>
                    <input type="email"
                           id="dont-email"
                           placeholder="Email">

                    <label for="dont-company">Company</label>
                    <input type="text"
                           id="dont-company"
                           placeholder="Company">

                </div>
            </div>

        </div>

    </div>

     

        
</body>
</html>
